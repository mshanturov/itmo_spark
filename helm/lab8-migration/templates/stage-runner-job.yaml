apiVersion: batch/v1
kind: Job
metadata:
  name: lab8-stage-runner
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.runner.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lab8-migration.name" . }}
        app.kubernetes.io/component: stage-runner
        lab.stage: {{ .Values.stage | quote }}
    spec:
      restartPolicy: {{ .Values.runner.restartPolicy }}
      containers:
        - name: stage-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - -m
            - src.lab8_k8s_runner
            - --stage
            - {{ .Values.stage | quote }}
            - --app-config
            - configs/app_config.yaml
            - --spark-config
            - configs/spark_config_k8s.yaml
            - --mongo-config
            - configs/mongo_config_k8s.yaml
            - --lab7-pipeline-config
            - configs/lab7_pipeline_k8s.yaml
            - --datamart-config
            - /app/datamart/conf/datamart-k8s.conf
{{- if ne .Values.stage "lab5" }}
{{- if .Values.runner.bootstrapIfEmpty }}
            - --bootstrap-if-empty
{{- end }}
{{- end }}
          env:
            - name: SBT_BIN
              value: /opt/sbt/bin/sbt
          volumeMounts:
            - name: runner-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "400m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
      volumes:
        - name: runner-data
{{- if .Values.storage.usePersistentVolume }}
          persistentVolumeClaim:
            claimName: lab8-runner-data
{{- else }}
          emptyDir: {}
{{- end }}
